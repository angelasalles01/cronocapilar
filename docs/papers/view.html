<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CronoCapilar · Paper</title>
  <link rel="stylesheet" href="assets/web3.css">
  <link rel="stylesheet" href="assets/papers.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="web3">
  <div class="web3-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid"></div>
  </div>

  <nav class="web3-nav">
    <a href="https://www.ang3la.xyz/" class="web3-nav-home" target="_blank" rel="noopener noreferrer">
      <span class="web3-nav-logo">A</span>
      <span>ANG3LA</span>
    </a>
    <a href="index.html">← Papers</a>
    <a href="https://www.ang3la.xyz/about/index.html" target="_blank" rel="noopener noreferrer">About Me</a>
    <a href="https://www.ang3la.xyz/bio" target="_blank" rel="noopener noreferrer">Link tree</a>
  </nav>

  <main class="viewer-main">
    <div class="viewer-card glass">
      <div id="loading" class="viewer-loading">
        <div class="viewer-spinner"></div>
        <p>Carregando documento...</p>
      </div>
      <article id="content" class="viewer-content"></article>
    </div>
  </main>

  <footer class="web3-footer">
    <a href="index.html">← Voltar aos Papers</a>
    <br /><br />
    <a href="https://www.ang3la.xyz/bio" target="_blank" rel="noopener noreferrer">Link tree — ang3la.xyz/bio</a>
  </footer>
  <script src="assets/chain.js"></script>
  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var doc = params.get('doc');
    var loading = document.getElementById('loading');
    var content = document.getElementById('content');

    if (!doc || !/^[A-Za-z0-9._-]+\.md$/.test(doc)) {
      loading.innerHTML = '<p style="color:#f472b6;">Documento não encontrado.</p>';
      return;
    }

    var name = doc.replace('.pt-BR.md', '').replace('.es-ES.md', '').replace('.md', '');
    document.title = 'CronoCapilar · ' + name;

    fetch('../' + doc)
      .then(function(r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(function(md) {
        md = md.replace(/<p align="center">[\s\S]*?<\/p>/g, '');
        md = md.replace(/<h1 align="center">(.*?)<\/h1>/g, '# $1');
        md = md.replace(/<h3 align="center">(.*?)<\/h3>/g, '### $1');
        md = md.replace(/<strong>(.*?)<\/strong>/g, '**$1**');
        md = md.replace(/<a href="(.*?)">(.*?)<\/a>/g, '[$2]($1)');
        md = md.replace(/<br\s*\/?>/g, '\n');
        md = md.replace(/<img[^>]*>/g, '');

        content.innerHTML = marked.parse(md);
        loading.style.display = 'none';
      })
      .catch(function() {
        loading.innerHTML = '<p style="color:#f472b6;">Erro ao carregar o documento. Abra via servidor local (ex.: <code>npx serve docs</code>) se estiver com file://.</p>';
      });
  })();
  </script>
</body>
</html>
